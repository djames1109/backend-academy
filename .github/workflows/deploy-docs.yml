name: Deploy MkDocs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python environment
        run: uv venv

      - name: Install dependencies
        run: uv pip install mkdocs-material

      - name: Deploy docs
        run: uv run mkdocs gh-deploy --force
